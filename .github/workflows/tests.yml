name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency check
        run: python -m pip check
      - name: Tests (simulated AutoCAD, offline DXF engine, real stdio subprocess)
        run: python -m pytest -m "not autocad" -q
      - name: Build
        run: |
          python -m pip install build
          python -m build

  linux-offline:
    # The DXF engine and MCP protocol layer do not need Windows or AutoCAD.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not autocad" -q
