[project]
name = "autocad-mcp"
version = "0.1.0"
description = "Local MCP server for AutoCAD drawing automation, block attributes and Excel workflows via Windows COM."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel de Souza Paixão" }]
keywords = ["mcp", "autocad", "plant3d", "cad", "piping", "pywin32"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "openpyxl>=3.1",
    "pydantic>=2.6",
]

[project.urls]
Repository = "https://github.com/C48H74/autocad-mcp"
Documentation = "https://github.com/C48H74/autocad-mcp#readme"
Homepage = "https://github.com/C48H74/autocad-mcp"
Issues = "https://github.com/C48H74/autocad-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autocad-mcp = "autocad_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "autocad: teste de integração que exige Windows + AutoCAD aberto (rode com -m autocad; exclua com -m 'not autocad')",
]
